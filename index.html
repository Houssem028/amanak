<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#08090d">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أمانك">

  <meta name="description"
        content="أمانك — تطبيق السلامة الشخصية ومشاركة الموقع">

  <link rel="manifest" href="manifest.webmanifest">

  <title>أمانك</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #08090d;
      color: #ffffff;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =========================
       SPLASH SCREEN
    ========================== */

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 35%, #26344d 0%, #10131c 35%, #08090d 75%);
      transition: opacity .5s ease, visibility .5s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      width: 100%;
      text-align: center;
      padding: 30px;
      animation: splashIn 1s ease;
    }

    .logo-circle {
      width: 105px;
      height: 105px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(145deg, #172235, #0c1018);

      border: 1px solid rgba(255,255,255,.15);

      box-shadow:
        0 0 0 8px rgba(255,255,255,.025),
        0 0 45px rgba(60,140,255,.18);
    }

    .logo-shield {
      font-size: 52px;
      filter: drop-shadow(0 0 15px rgba(75,145,255,.5));
    }

    .splash-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .splash-subtitle {
      margin-top: 8px;
      color: #9ea7b8;
      font-size: 15px;
    }

    .loading {
      width: 120px;
      height: 3px;
      margin: 35px auto 0;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
    }

    .loading::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #4d9cff;
      animation: loading 1.1s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        transform: translateX(250%);
      }
      100% {
        transform: translateX(-250%);
      }
    }

    @keyframes splashIn {
      from {
        opacity: 0;
        transform: scale(.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       APP
    ========================== */

    #app {
      min-height: 100vh;
      display: none;
      padding-bottom: 90px;
    }

    #app.show {
      display: block;
      animation: appIn .45s ease;
    }

    @keyframes appIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        max(18px, env(safe-area-inset-top))
        18px
        14px;

      background: rgba(8,9,13,.86);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(145deg,#1b2b43,#0d1625);
      font-size: 21px;

      box-shadow: 0 8px 25px rgba(45,130,255,.12);
    }

    .brand-text {
      font-size: 21px;
      font-weight: 900;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #8f98a8;
      font-size: 12px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #35d68a;
      box-shadow: 0 0 10px rgba(53,214,138,.6);
    }

    .content {
      width: min(100%, 520px);
      margin: auto;
      padding: 18px;
    }

    .welcome {
      margin: 8px 0 20px;
    }

    .welcome small {
      color: #8992a2;
      font-size: 13px;
    }

    .welcome h1 {
      margin-top: 5px;
      font-size: 27px;
      font-weight: 900;
    }

    /* =========================
       MAP CARD
    ========================== */

    .map-card {
      position: relative;
      height: 310px;
      overflow: hidden;

      border-radius: 28px;

      background:
        radial-gradient(circle at 50% 45%, rgba(55,112,190,.18), transparent 35%),
        linear-gradient(145deg,#121923,#090c11);

      border: 1px solid rgba(255,255,255,.07);

      box-shadow:
        0 18px 50px rgba(0,0,0,.3);
    }

    .map-grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);

      background-size: 42px 42px;
      transform: rotate(-7deg) scale(1.25);
    }

    .road {
      position: absolute;
      height: 2px;
      width: 150%;
      left: -20%;
      background: rgba(112,140,170,.17);
      transform: rotate(-24deg);
    }

    .road.r1 {
      top: 38%;
    }

    .road.r2 {
      top: 65%;
      transform: rotate(19deg);
    }

    .road.r3 {
      top: 50%;
      transform: rotate(74deg);
    }

    .location-marker {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;

      transform: translate(-50%,-50%);

      border-radius: 50%;
      background: #4c9cff;

      border: 4px solid #dcebff;

      box-shadow:
        0 0 0 12px rgba(76,156,255,.14),
        0 0 30px rgba(76,156,255,.65);
    }

    .map-label {
      position: absolute;
      right: 14px;
      top: 14px;

      padding: 8px 12px;
      border-radius: 12px;

      background: rgba(8,9,13,.72);
      border: 1px solid rgba(255,255,255,.08);

      font-size: 12px;
      color: #aeb7c7;
    }

    /* =========================
       MAIN ACTION
    ========================== */

    .start-button {
      width: 100%;
      margin-top: 15px;
      padding: 18px;

      border-radius: 20px;

      color: #fff;
      font-size: 17px;
      font-weight: 800;

      background: linear-gradient(135deg,#347fe0,#2462b8);

      box-shadow:
        0 14px 35px rgba(37,105,190,.25);
    }

    .start-button:active {
      transform: scale(.98);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 13px;
    }

    .quick-card {
      min-height: 112px;
      padding: 17px;

      border-radius: 21px;

      text-align: right;

      background: #10141c;
      border: 1px solid rgba(255,255,255,.06);

      color: #fff;
    }

    .quick-card:active {
      transform: scale(.98);
    }

    .quick-icon {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;
      background: rgba(255,255,255,.06);

      font-size: 19px;
      margin-bottom: 12px;
    }

    .quick-card strong {
      display: block;
      font-size: 14px;
    }

    .quick-card span {
      display: block;
      margin-top: 4px;
      color: #7f899a;
      font-size: 11px;
    }

    /* =========================
       SOS
    ========================== */

    .sos {
      margin-top: 14px;
      padding: 18px;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(150,35,45,.2),
          rgba(55,18,24,.15)
        );

      border: 1px solid rgba(255,90,100,.15);
    }

    .sos-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sos-title {
      font-weight: 900;
      font-size: 17px;
    }

    .sos-description {
      margin-top: 5px;
      color: #8f98a7;
      font-size: 12px;
    }

    .sos-button {
      width: 62px;
      height: 62px;
      flex-shrink: 0;

      border-radius: 50%;

      background: linear-gradient(145deg,#ff5661,#d8323d);

      color: white;
      font-size: 13px;
      font-weight: 900;

      box-shadow:
        0 8px 25px rgba(225,50,60,.3);
    }

    /* =========================
       BOTTOM NAV
    ========================== */

    .bottom-nav {
      position: fixed;
      z-index: 500;

      left: 10px;
      right: 10px;
      bottom: max(10px, env(safe-area-inset-bottom));

      height: 68px;

      display: grid;
      grid-template-columns: repeat(4,1fr);

      padding: 6px;

      border-radius: 23px;

      background: rgba(17,20,27,.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255,255,255,.07);

      box-shadow: 0 15px 45px rgba(0,0,0,.4);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 3px;

      background: transparent;
      color: #70798a;

      border-radius: 18px;
      font-size: 10px;
    }

    .nav-item .nav-icon {
      font-size: 19px;
    }

    .nav-item.active {
      color: #fff;
      background: rgba(76,156,255,.12);
    }

    /* =========================
       TOAST
    ========================== */

    #toast {
      position: fixed;
      z-index: 10000;

      left: 18px;
      right: 18px;
      bottom: 95px;

      padding: 14px 16px;

      border-radius: 16px;

      background: rgba(24,28,37,.96);
      border: 1px solid rgba(255,255,255,.08);

      color: #fff;
      text-align: center;
      font-size: 13px;

      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;

      transition: .25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (min-width: 700px) {
      body {
        background: #050609;
      }

      #app {
        max-width: 540px;
        margin: auto;
        background: #08090d;
        min-height: 100vh;
        box-shadow: 0 0 80px rgba(0,0,0,.35);
      }

      .bottom-nav {
        max-width: 520px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <!-- SPLASH -->

  <section id="splash">

    <div class="splash-content">

      <div class="logo-circle">
        <div class="logo-shield">🛡️</div>
      </div>

      <div class="splash-title">أمانك</div>

      <div class="splash-subtitle">
        وين ما تمشي… حدّ معاك.
      </div>

      <div class="loading"></div>

    </div>

  </section>


  <!-- APP -->

  <main id="app">

    <header class="topbar">

      <div class="brand">

        <div class="brand-icon">🛡️</div>

        <div class="brand-text">
          أمانك
        </div>

      </div>

      <div class="connection">

        <span class="connection-dot"></span>

        <span id="connectionText">
          متصل
        </span>

      </div>

    </header>


    <section class="content">

      <div class="welcome">

        <small>
          مساء الخير 👋
        </small>

        <h1>
          خليك بأمان
        </h1>

      </div>


      <!-- MAP -->

      <section class="map-card">

        <div class="map-grid"></div>

        <div class="road r1"></div>
        <div class="road r2"></div>
        <div class="road r3"></div>

        <div class="map-label">
          📍 موقعك الحالي
        </div>

        <div class="location-marker"></div>

      </section>


      <!-- START TRIP -->

      <button
        class="start-button"
        id="startTrip">

        🚗 ابدأ رحلة آمنة

      </button>


      <!-- QUICK ACTIONS -->

      <div class="quick-grid">

        <button class="quick-card" id="trustedBtn">

          <div class="quick-icon">
            👥
          </div>

          <strong>
            الأشخاص الموثوقون
          </strong>

          <span>
            اختر من يمكنه متابعتك
          </span>

        </button>


        <button class="quick-card" id="locationBtn">

          <div class="quick-icon">
            📍
          </div>

          <strong>
            موقعي
          </strong>

          <span>
            تحديد موقعك الحالي
          </span>

        </button>


        <button class="quick-card" id="lostBtn">

          <div class="quick-icon">
            🔐
          </div>

          <strong>
            هاتفي ضائع
          </strong>

          <span>
            حماية الحساب والجهاز
          </span>

        </button>


        <button class="quick-card" id="settingsBtn">

          <div class="quick-icon">
            ⚙️
          </div>

          <strong>
            الإعدادات
          </strong>

          <span>
            الحساب والخصوصية
          </span>

        </button>

      </div>


      <!-- SOS -->

      <section class="sos">

        <div class="sos-header">

          <div>

            <div class="sos-title">
              🚨 حالة طارئة؟
            </div>

            <div class="sos-description">
              اضغط SOS لإرسال تنبيه طوارئ
            </div>

          </div>

          <button
            class="sos-button"
            id="sosButton">

            SOS

          </button>

        </div>

      </section>

    </section>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

      <button class="nav-item active">

        <span class="nav-icon">🏠</span>
        <span>الرئيسية</span>

      </button>

      <button class="nav-item" id="tripNav">

        <span class="nav-icon">🚗</span>
        <span>الرحلة</span>

      </button>

      <button class="nav-item" id="peopleNav">

        <span class="nav-icon">👥</span>
        <span>الموثوقون</span>

      </button>

      <button class="nav-item" id="profileNav">

        <span class="nav-icon">👤</span>
        <span>حسابي</span>

      </button>

    </nav>

  </main>


  <div id="toast"></div>


  <script>

    /* =========================
       SPLASH
    ========================== */

    window.addEventListener("load", () => {

      setTimeout(() => {

        document
          .getElementById("splash")
          .classList.add("hide");

        document
          .getElementById("app")
          .classList.add("show");

      }, 1800);

    });


    /* =========================
       TOAST
    ========================== */

    function showToast(message) {

      const toast = document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);

    }


    /* =========================
       CONNECTION
    ========================== */

    function updateConnection() {

      const text =
        document.getElementById("connectionText");

      const dot =
        document.querySelector(".connection-dot");

      if (navigator.onLine) {

        text.textContent = "متصل";
        dot.style.background = "#35d68a";

      } else {

        text.textContent = "بدون إنترنت";
        dot.style.background = "#ff5661";

      }

    }

    window.addEventListener("online", updateConnection);
    window.addEventListener("offline", updateConnection);

    updateConnection();


    /* =========================
       GPS
    ========================== */

    document
      .getElementById("locationBtn")
      .addEventListener("click", () => {

        if (!navigator.geolocation) {

          showToast("هذا الجهاز لا يدعم تحديد الموقع");

          return;
        }

        showToast("جاري تحديد موقعك...");

        navigator.geolocation.getCurrentPosition(

          position => {

            const lat =
              position.coords.latitude.toFixed(5);

            const lng =
              position.coords.longitude.toFixed(5);

            showToast(
              `تم تحديد موقعك: ${lat}, ${lng}`
            );

          },

          () => {

            showToast(
              "لم نتمكن من الوصول إلى موقعك. تأكد من السماح بـ GPS."
            );

          },

          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }

        );

      });


    /* =========================
       START TRIP
    ========================== */

    document
      .getElementById("startTrip")
      .addEventListener("click", () => {

        showToast(
          "بدأت الرحلة. سيتم تجهيز مشاركة الموقع."
        );

      });


    /* =========================
       SOS
    ========================== */

    document
      .getElementById("sosButton")
      .addEventListener("click", () => {

        const confirmSOS =
          confirm(
            "هل أنت متأكد أنك تريد تفعيل حالة الطوارئ؟"
          );

        if (confirmSOS) {

          showToast(
            "🚨 تم تفعيل SOS — هذه نسخة تجريبية حالياً."
          );

        }

      });


    /* =========================
       OTHER BUTTONS
    ========================== */

    document
      .getElementById("trustedBtn")
      .addEventListener("click", () => {

        showToast(
          "قسم الأشخاص الموثوقين قادم في الخطوة التالية."
        );

      });


    document
      .getElementById("lostBtn")
      .addEventListener("click", () => {

        showToast(
          "وضع الهاتف الضائع سيتم تفعيله لاحقاً."
        );

      });


    document
      .getElementById("settingsBtn")
      .addEventListener("click", () => {

        showToast(
          "الإعدادات سيتم إضافتها في النسخة القادمة."
        );

      });


    document
      .getElementById("tripNav")
      .addEventListener("click", () => {

        showToast(
          "قسم الرحلة قيد التجهيز."
        );

      });


    document
      .getElementById("peopleNav")
      .addEventListener("click", () => {

        showToast(
          "قسم الأشخاص الموثوقين قيد التجهيز."
        );

      });


    document
      .getElementById("profileNav")
      .addEventListener("click", () => {

        showToast(
          "قسم الحساب قيد التجهيز."
        );

      });


    /* =========================
       SERVICE WORKER
    ========================== */

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./sw.js")
          .catch(() => {});

      });

    }

  </script>

</body>
  </html>
